[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va-layer-02-outlier-escalation"
version = "0.1.0"
description = "Outlier detection as hard escalation — statistical disagreement is a signal, not noise"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
