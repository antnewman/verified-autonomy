[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va-layer-04-calibration"
version = "0.1.0"
description = "Calibration and conformal prediction — the only confidence score with a mathematical guarantee"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["type-arg", "no-any-return"]

[tool.ruff]
target-version = "py311"
