[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va-layer-01-confidence-weighting"
version = "0.1.0"
description = "Inverse confidence weighting — surface your weakest signal, not your average"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
