[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va-layer-08-cryptographic-audit"
version = "0.1.0"
description = "Cryptographic audit trails — proving what the system did"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
