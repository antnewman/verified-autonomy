[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va-layer-05-deterministic-guardrails"
version = "0.1.0"
description = "Deterministic guardrails — the constitutional court that holds final power"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
disable_error_code = ["type-arg", "no-any-return"]

[tool.ruff]
target-version = "py311"
