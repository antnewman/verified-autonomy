[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verified-autonomy"
version = "0.1.0"
description = "Production-grade trust engineering techniques for AI systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ant Newman", email = "antjsnewman@outlook.com" },
    { name = "Shanti Greene" },
]
keywords = ["ai", "trust", "safety", "confidence", "verification", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/antnewman/verified-autonomy"
Documentation = "https://verified-autonomy.netlify.app"
Repository = "https://github.com/antnewman/verified-autonomy"
Changelog = "https://github.com/antnewman/verified-autonomy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
